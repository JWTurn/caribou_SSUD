## Render the module's manual, caribou_SSUD.Rmd, to caribou_SSUD.html. The manual's tables come from
## the module's metadata (defineModule() in caribou_SSUD.R), so it needs SpaDES.core but no data. On a
## pull request it only checks that the manual renders; on a push to main it also commits the html.
## The PredictiveEcology packages are pinned to the commits test-module.yaml uses.
name: Render module Rmd

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/render-module-rmd.yaml
      - caribou_SSUD.Rmd
      - caribou_SSUD.R
  push:
    branches:
      - main
    paths:
      - .github/workflows/render-module-rmd.yaml
      - caribou_SSUD.Rmd
      - caribou_SSUD.R
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    if: "!contains(github.event.head_commit.message, '[skip-ci]')"
    name: Render module Rmd
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v6

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::bookdown
            any::kableExtra
            any::knitr
            any::rmarkdown
            github::PredictiveEcology/Require@d6e3df6f63026d3b1047f2ca28632685553521b4
            github::PredictiveEcology/quickPlot@a49fab61de547aaffd7f8fb5629571f88b4022f9
            github::PredictiveEcology/reproducible@b56c3003823a3bf5bd129dc1ebcdccb64c339589
            github::PredictiveEcology/SpaDES.core@a21acb0493692ea305560893702b2401d01da8ee

      ## the Rmd reads the module's metadata from '..', so the checkout folder must be named
      ## caribou_SSUD (it is, unless the repository is renamed or forked under another name)
      - name: Render module Rmd
        run: rmarkdown::render("caribou_SSUD.Rmd", encoding = "UTF-8")
        shell: Rscript {0}

      - name: Commit results
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: |
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git add caribou_SSUD.html
          git commit -m 'Re-build caribou_SSUD.Rmd [skip-ci]' || { echo "No changes to commit"; exit 0; }
          git push origin HEAD:${{ github.ref }}
